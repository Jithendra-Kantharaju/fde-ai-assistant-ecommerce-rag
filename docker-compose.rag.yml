services:
  chroma:
    image: chromadb/chroma:latest
    command: ["chroma", "run", "--host", "0.0.0.0", "--port", "8000", "--path", "/chroma/chroma"]
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

  assistant:
    build:
      context: .
      dockerfile: assistant_api/Dockerfile
    env_file:
      - .env
    environment:
      APP_SOURCE_ROOT: /workspace
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: product_assistant
    volumes:
      - ./:/workspace:ro
    ports:
      - "8001:8000"
    depends_on:
      - chroma

volumes:
  chroma-data:
